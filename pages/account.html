<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account &amp; Order History | Crave Corner</title>

  <!-- Google Fonts: Playfair Display (Headings) & Poppins (Body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS (Official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Crave Corner Shared & Account Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/account.css">
</head>
<body>
  <!-- Shared Header (injected by js/layout.js) -->
  <header id="site-header"></header>

  <!-- Main Content -->
  <main class="container py-5">
    <section id="account-dashboard" class="cc-account-section d-none" aria-label="Account and Order History">
      <div class="row g-4 align-items-start">
        <!-- Left Column: Profile Card -->
        <div class="col-12 col-lg-4">
          <aside class="cc-card cc-profile-card p-4" aria-labelledby="profile-heading">
            <div class="text-center mb-4">
              <div class="cc-profile-avatar mb-3" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <h2 id="profile-heading" class="cc-profile-heading mb-1">My Profile</h2>
              <p id="account-welcome-text" class="cc-profile-welcome mb-0">Welcome!</p>
            </div>

            <nav class="cc-account-nav" aria-label="Account sections">
              <a
                href="#order-history-section"
                class="cc-account-nav-item active"
                aria-current="page"
              >
                My Orders
              </a>
              <a
                href="favorites.html"
                class="cc-account-nav-item"
              >
                My Favorites
              </a>
              <button
                type="button"
                id="account-logout-btn"
                class="cc-account-nav-item cc-account-logout-btn"
              >
                Logout
              </button>
            </nav>
          </aside>
        </div>

        <!-- Right Column: My Order History Panel -->
        <div class="col-12 col-lg-8">
          <section
            id="order-history-section"
            class="cc-card cc-orders-panel p-4 p-md-5"
            aria-labelledby="order-history-heading"
          >
            <h1 id="order-history-heading" class="cc-orders-heading mb-4">My Order History</h1>

            <!-- Order Rows Container (populated by js/account.js) -->
            <div id="orders-list" class="cc-orders-list" aria-live="polite"></div>

            <!-- Empty Orders State -->
            <div id="orders-empty-state" class="cc-orders-empty text-center p-4 d-none" aria-live="polite">
              <p class="cc-orders-empty-title mb-2">You haven't placed any orders yet.</p>
              <p class="cc-orders-empty-text mb-4">
                Explore our freshly prepared burgers, pizzas, and sides to start your first order.
              </p>
              <a href="menu.html" class="btn btn-cc-primary px-4">Browse Menu</a>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <!-- Order Details Modal -->
  <div
    class="modal fade"
    id="orderDetailsModal"
    tabindex="-1"
    aria-labelledby="orderDetailsModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content cc-modal-content">
        <div class="modal-header cc-modal-header">
          <div class="d-flex align-items-center flex-wrap gap-2">
            <h2 class="modal-title cc-modal-title" id="orderDetailsModalLabel">Order Details</h2>
            <span id="modal-order-status" class="cc-status-badge"></span>
          </div>
          <button
            type="button"
            class="btn-close cc-modal-close"
            data-bs-dismiss="modal"
            aria-label="Close order details"
          ></button>
        </div>

        <div class="modal-body cc-modal-body">
          <div class="table-responsive">
            <table class="table cc-order-items-table align-middle mb-3">
              <thead>
                <tr>
                  <th scope="col">Item</th>
                  <th scope="col" class="text-center">Qty</th>
                  <th scope="col" class="text-end">Unit Price</th>
                  <th scope="col" class="text-end">Line Total</th>
                </tr>
              </thead>
              <tbody id="modal-order-items-body"></tbody>
            </table>
          </div>

          <div class="cc-order-totals pt-3">
            <div class="cc-total-row">
              <span>Subtotal</span>
              <span id="modal-order-subtotal" class="fw-medium"></span>
            </div>
            <div id="modal-delivery-row" class="cc-total-row d-none">
              <span>Delivery</span>
              <span id="modal-order-delivery" class="fw-medium"></span>
            </div>
            <div class="cc-total-row cc-total-row-final pt-2 mt-2">
              <span>Total</span>
              <span id="modal-order-total" class="cc-price"></span>
            </div>
          </div>
        </div>

        <div class="modal-footer cc-modal-footer">
          <button type="button" class="btn btn-cc-secondary px-4" data-bs-dismiss="modal">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared Footer (injected by js/layout.js) -->
  <footer id="site-footer" class="cc-footer mt-auto"></footer>

  <!-- Bootstrap 5 JS Bundle (Official CDN, includes Popper for dropdowns, navbar, and modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared Layout & Account Scripts -->
  <script src="../js/layout.js"></script>
  <script src="../js/account.js"></script>
</body>
</html>
