<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | Crave Corner</title>

  <!-- Google Fonts: Playfair Display (Headings) & Poppins (Body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS (Official CDN, required by shared layout.js header/footer) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Crave Corner Shared & Cart Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body class="cart-page-body">
  <!-- Shared Header (injected by ../js/layout.js) -->
  <header id="site-header"></header>

  <!-- Main Cart Page Content -->
  <main class="cart-main">
    <div class="cart-container">
      <h1 class="cart-title">Your Cart</h1>

      <!-- Empty Cart State (shown when localStorage cc_cart is empty) -->
      <section id="empty-cart-section" class="cc-card empty-cart-card d-none" aria-label="Empty cart">
        <p class="empty-cart-message">Your cart is empty!</p>
        <a href="menu.html" id="browse-menu-link" class="btn btn-cc-primary cart-btn-primary">Browse Menu</a>
      </section>

      <!-- Two-Column Cart Layout (Desktop: items + promo on left, summary on right) -->
      <div id="cart-layout" class="cart-layout d-none">
        <!-- Left Column: Product Cards + Promo Code Card -->
        <div class="cart-left-column">
          <!-- Cart Product Cards Section (filled by js/cart.js) -->
          <section id="cart-items-list" class="cart-items-list" aria-label="Cart items" aria-live="polite"></section>

          <!-- Promo Code Card -->
          <section class="cc-card promo-card" aria-label="Promo code">
            <label for="promo-input" class="promo-label">Promo Code</label>
            <div class="promo-input-row">
              <input
                type="text"
                id="promo-input"
                class="form-control cc-input promo-input"
                placeholder="Enter promo code (e.g. CRAVE10)"
                autocomplete="off"
              >
              <button type="button" id="apply-promo-btn" class="btn btn-cc-secondary cart-btn-secondary promo-apply-btn">
                Apply
              </button>
            </div>
            <p id="promo-message" class="promo-message" role="status" aria-live="polite"></p>
          </section>
        </div>

        <!-- Right Column: Order Summary Card -->
        <aside class="cart-right-column" aria-label="Order summary">
          <div class="cc-card summary-card">
            <h2 class="summary-heading">Order Summary</h2>

            <div class="summary-row">
              <span class="summary-label">Subtotal</span>
              <span id="summary-subtotal" class="summary-value">Rs. 0</span>
            </div>

            <div class="summary-row">
              <span class="summary-label">Delivery Fee</span>
              <span id="summary-delivery" class="summary-value">Rs. 0</span>
            </div>

            <div class="summary-row">
              <span class="summary-label">Tax (5%)</span>
              <span id="summary-tax" class="summary-value">Rs. 0</span>
            </div>

            <hr class="summary-divider">

            <div class="summary-row summary-total-row">
              <span class="summary-total-label">Total</span>
              <span id="summary-total" class="summary-total-value">Rs. 0</span>
            </div>

            <button type="button" id="checkout-btn" class="btn btn-cc-primary cart-btn-primary summary-checkout-btn">
              Proceed to Checkout
            </button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <!-- Sticky Mobile Bottom Summary Bar (visible on screens <= 960px when cart has items) -->
  <div id="mobile-summary-bar" class="mobile-summary-bar d-none" aria-label="Mobile order total">
    <div class="mobile-summary-info">
      <span class="mobile-summary-label">Total</span>
      <span id="mobile-summary-total" class="mobile-summary-value">Rs. 0</span>
    </div>
    <button type="button" id="mobile-checkout-btn" class="btn btn-cc-primary cart-btn-primary mobile-checkout-btn">
      Proceed to Checkout
    </button>
  </div>

  <!-- Shared Footer (injected by ../js/layout.js) -->
  <footer id="site-footer" class="cc-footer mt-auto"></footer>

  <!-- Bootstrap 5 JS Bundle (Official CDN, required by shared layout.js dropdowns and navbar collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared Header/Footer Script & Cart Script -->
  <script src="../js/layout.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
