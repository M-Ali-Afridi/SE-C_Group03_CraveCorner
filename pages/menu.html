<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Our Menu | Crave Corner</title>

  <!-- Google Fonts: Playfair Display (Headings) & Poppins (Body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS (Official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Crave Corner Shared & Menu Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/menu.css">
</head>
<body>
  <!-- Shared Header (injected by js/layout.js) -->
  <header id="site-header"></header>

  <!-- Page Content -->
  <main class="container py-5">
    <h1 class="mb-4">Explore Our Menu</h1>

    <form id="menu-search-form" class="cc-menu-search-wrap mb-3" role="search">
      <label for="menu-search" class="visually-hidden">Search menu dishes</label>
      <input
        type="search"
        id="menu-search"
        class="form-control cc-input"
        placeholder="Search any dish, e.g. chicken, cheese or mango"
        autocomplete="off"
      >
    </form>

    <div class="cc-filter-bar mb-4" role="group" aria-label="Filter menu by category">
      <button type="button" class="btn btn-cc-primary cc-filter-btn" data-category="All" aria-pressed="true">All</button>
      <button type="button" class="btn btn-cc-secondary cc-filter-btn" data-category="Burgers" aria-pressed="false">Burgers</button>
      <button type="button" class="btn btn-cc-secondary cc-filter-btn" data-category="Pizza" aria-pressed="false">Pizza</button>
      <button type="button" class="btn btn-cc-secondary cc-filter-btn" data-category="Pasta" aria-pressed="false">Pasta</button>
      <button type="button" class="btn btn-cc-secondary cc-filter-btn" data-category="Sides" aria-pressed="false">Sides</button>
      <button type="button" class="btn btn-cc-secondary cc-filter-btn" data-category="Drinks" aria-pressed="false">Drinks</button>
    </div>

    <div id="menu-results" class="row g-4" aria-live="polite"></div>
  </main>

  <!-- Shared Footer (injected by js/layout.js) -->
  <footer id="site-footer" class="cc-footer mt-auto"></footer>

  <!-- Bootstrap 5 JS Bundle (Official CDN, includes Popper for dropdowns and navbar collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared Layout & Menu Scripts -->
  <script src="../js/layout.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/menu.js"></script>
</body>
</html>
