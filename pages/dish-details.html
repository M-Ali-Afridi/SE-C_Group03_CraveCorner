<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dish Details | Crave Corner</title>

  <!-- Google Fonts: Playfair Display (Headings) & Poppins (Body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS (Official CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Crave Corner Shared & Dish Details Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dish-details.css">
</head>
<body>
  <!-- Shared Header (injected by js/layout.js) -->
  <header id="site-header"></header>

  <!-- Page Content (empty containers filled by js/dish-details.js) -->
  <main class="container py-5">
    <div id="dish-error-state"></div>
    <section id="dish-detail-section"></section>
    <section id="recently-viewed-section" class="mt-5"></section>
    <section id="related-dishes-section" class="mt-5"></section>
  </main>

  <!-- Shared Footer (injected by js/layout.js) -->
  <footer id="site-footer" class="cc-footer mt-auto"></footer>

  <!-- Bootstrap 5 JS Bundle (Official CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared Layout, Menu Data & Dish Details Scripts -->
  <script src="../js/layout.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/dish-details.js"></script>
</body>
</html>
