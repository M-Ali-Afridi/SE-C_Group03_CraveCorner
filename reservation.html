<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Table Reservation - Crave Corner</title>
  <link rel="stylesheet" href="css/deal.css">
</head>
<body>
  <h1>Reserve a Table</h1>
  <form id="reservationForm">
    <label>Name <input type="text" id="name" required></label>
    <label>Phone <input type="tel" id="phone" required></label>
    <label>Date <input type="date" id="date" required></label>
    <label>Time <input type="time" id="time" required></label>
    <label>Guests <input type="number" id="guests" min="1" max="12" required></label>
    <button type="submit">Book Table</button>
    <p id="message"></p>
  </form>
  <script src="js/reservation.js"></script>
</body>
</html>
